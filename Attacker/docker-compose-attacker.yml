# Portable Wi-Fi attacker container for the WiFiChallenge toolset.
#
# Meant to be used ALWAYS, not just against the lab: a full, self-contained
# offensive Wi-Fi box for any Linux host. It works against the simulated lab (the
# mac80211_hwsim wlan0..wlan6 radios) AND against real networks with real USB
# Wi-Fi adapters (Alfa & compatible) -- monitor mode + packet injection included.
#
# Access is by docker exec ONLY (no SSH, no GUI, no RDP):
#
#   docker compose -f docker-compose-attacker.yml up -d --build
#   docker compose -f docker-compose-attacker.yml exec attacker bash
#
# Real adapters WITHOUT USB passthrough: because of `network_mode: host` the
# container shares the host's network namespace AND kernel, so any adapter whose
# driver is loaded on the host already appears as wlanX inside the container --
# no /dev/bus/usb needed. /lib/modules + /usr/src are mounted so the bundled DKMS
# drivers can be (re)built and modprobe'd INTO the host kernel for adapters the
# host doesn't already support. Only pass /dev/bus/usb through for tools that talk
# to the raw USB device (libusb / usb_modeswitch / in-container lsusb).
#
# SECURITY: privileged + host networking; it can transmit on any radio it sees.
# Only attack networks you are authorised to test.
services:
  attacker:
    build: ./Attacker
    image: wifichallengelab-attacker:latest
    container_name: WiFiChallengeLab-Attacker
    restart: unless-stopped
    privileged: true          # NETNS + raw 802.11 access (monitor mode / injection)
    network_mode: host        # shares the host netns: sees every wlan (virtual + real)
    volumes:
      - /lib/modules:/lib/modules   # host kernel modules (Alfa DKMS drivers build/load here)
      - /usr/src:/usr/src           # kernel headers/sources for DKMS builds
      # A real adapter already appears as wlanX via host networking above; only add
      # this for tools that need the raw USB device (libusb / usb_modeswitch / lsusb):
      # - /dev/bus/usb:/dev/bus/usb