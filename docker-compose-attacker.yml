# Standalone attacker container for the WiFiChallenge academy lab.
#
# Access is by docker exec ONLY (no SSH, no GUI, no RDP):
#
#   docker compose -f docker-compose-attacker.yml up -d --build
#   docker compose -f docker-compose-attacker.yml exec attacker bash
#
# It shares the host network namespace so it sees the lab's mac80211_hwsim
# wlan interfaces (wlan0..wlan6), and mounts /lib/modules + /usr/src for kernel
# modules and DKMS (Alfa) driver builds.
#
# WARNING: privileged + host networking. Run it only inside the lab VM, never on
# a physical host you rely on.
services:
  attacker:
    build: ./Attacker
    image: wifichallengelab-attacker:latest
    container_name: WiFiChallengeLab-Attacker
    restart: unless-stopped
    privileged: true          # NETNS + raw 802.11 access
    network_mode: host        # see the mac80211_hwsim wlan0..wlan6 interfaces
    volumes:
      - /lib/modules:/lib/modules
      - /usr/src:/usr/src
      # - /dev/bus/usb:/dev/bus/usb   # uncomment to pass through real Alfa USB adapters
      # - ./certs:/root/certs:ro      # uncomment for Enterprise / EAP-TLS attacks
    # tini (image ENTRYPOINT) is PID 1 and reaps exec'd processes; `sleep
    # infinity` (image CMD) keeps the container up. Attach with:
    #   docker compose -f docker-compose-attacker.yml exec attacker bash
